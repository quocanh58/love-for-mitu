<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lời anh muốn nói với Lỡ 🥰💖</title>
    <script src="js/auth.js"></script>
    <script>auth.checkAuth();</script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-pink-200 via-pink-100 to-rose-200 flex items-center justify-center px-4"
  >
    <!-- BACK -->
    <a
      href="index.html"
      class="fixed top-4 left-4 bg-pink-500 text-white px-4 py-2 rounded-full shadow"
    >
      ← Home
    </a>

    <!-- CARD -->
    <div class="glass max-w-xl w-full p-8 text-center space-y-6">
      <h1 class="text-3xl font-bold text-pink-600">💌 Lời anh muốn nói</h1>

      <p
        id="content"
        class="text-gray-700 text-lg leading-relaxed whitespace-pre-line"
      >
        ...
      </p>

      <p class="text-sm text-gray-500">Luôn có anh ở đây, cùng em 💖</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const msgId = params.get("id");

      if (msgId) {
        auth.fetchProtected(`/api/messages/${msgId}`)
            .then(res => {
                if(!res.ok) throw new Error('Not found');
                return res.json();
            })
            .then(data => {
                document.getElementById("content").innerText = data.content;
            })
            .catch(() => {
                document.getElementById("content").innerText = "Tin nhắn không tồn tại hoặc đã bị xóa.";
            });
      } else {
        document.getElementById("content").innerText =
          "Anh yêu em nhiều lắm 💖";
      }
    </script>
    <script src="js/music.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", initMusic);
    </script>

    <script src="js/main.js"></script>
  </body>
</html>
