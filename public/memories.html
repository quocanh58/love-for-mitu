<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kỷ niệm của tụi mình 🥰</title>
    <script src="js/auth.js"></script>
    <script>auth.checkAuth();</script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .glass {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(236, 72, 153, 0.25);
      }

      .memory {
        animation: fadeUp 0.6s ease forwards;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(236, 72, 153, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(236, 72, 153, 0);
        }
      }
      /* ===== MODAL & BUTTON ANIMATION ===== */
      .animate-bounce-slow {
        animation: bounceSlow 3s infinite;
      }
      @keyframes bounceSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-pink-200 via-pink-100 to-rose-200 px-4 pt-24 pb-12 md:py-12"
  >
    <!-- BACK -->
    <a
      href="index.html"
      class="fixed top-4 left-4 z-50 bg-pink-500 text-white px-4 py-2 rounded-full shadow-lg hover:scale-105 transition"
    >
      ← Home
    </a>

    <div class="max-w-4xl mx-auto">
      
      <!-- HEADER + SORT -->
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-xl md:text-3xl font-bold text-pink-600 drop-shadow-sm">📖 Danh sách kỷ niệm</h2>
        
        <div class="flex gap-2">
            <select id="sortOrder" onchange="syncSort(this.value)" class="glass border-none text-pink-600 text-xs md:text-sm rounded-xl px-3 py-2 outline-none shadow-sm cursor-pointer hover:bg-white/80 transition">
                <option value="newest_date">📅 Mới nhất</option>
                <option value="oldest_date">📅 Cũ nhất</option>
                <option value="recently_added">✨ Vừa thêm</option>
            </select>
        </div>
      </div>

      <!-- LIST CONTAINER -->
      <div id="list" class="space-y-6 min-h-[50vh]"></div>

    </div>

    <!-- ===== FLOATING ADD BUTTON ===== -->
    <button
      onclick="openCreateModal()"
      class="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-pink-500 to-rose-500 hover:scale-110 active:scale-95 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center text-4xl transition duration-300 animate-bounce-slow"
    >
      ➕
    </button>

    <!-- ===== MODAL FORM ===== -->
    <div
      id="memoryModal"
      class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 transition-opacity duration-300"
      onclick="if(event.target === this) closeModal()"
    >
      <div class="bg-white/95 backdrop-blur-xl p-8 rounded-[32px] shadow-2xl max-w-lg w-full transform transition-all scale-100 relative">
        
        <!-- Close Button -->
        <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">
            ✕
        </button>

        <h1 id="modal-title" class="text-3xl font-bold text-pink-600 text-center mb-2">
          Thêm kỷ niệm mới
        </h1>

        <p class="text-center text-gray-500 text-sm mb-6">
          Lưu giữ những khoảnh khắc ngọt ngào �
        </p>

        <div class="space-y-5">
          <input type="hidden" id="memory-id">
          
          <div>
            <label class="block text-pink-600 font-bold mb-2 ml-1">📅 Ngày</label>
            <input
              id="date"
              type="date"
              class="w-full px-5 py-3 rounded-xl bg-pink-50 border-none focus:ring-2 focus:ring-pink-400 outline-none text-gray-700 font-medium"
            />
          </div>

          <div>
            <label class="block text-pink-600 font-bold mb-2 ml-1">💭 Nội dung</label>
            <textarea
              id="text"
              rows="5"
              placeholder="Kể về ngày hôm nay đi..."
              class="w-full px-5 py-3 rounded-xl bg-pink-50 border-none focus:ring-2 focus:ring-pink-400 outline-none text-gray-700 leading-relaxed resize-none"
            ></textarea>
          </div>

          <button
            id="save-btn"
            onclick="saveMemory()"
            class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition transform active:scale-95"
          >
            Lưu lại nhé 💖
          </button>
        </div>

      </div>
    </div>

    <script>
      const API_URL = '/api/memories';

      async function saveMemory() {
        const id = document.getElementById("memory-id").value;
        const date = document.getElementById("date").value;
        const text = document.getElementById("text").value;

        if (!date || !text) return;

        try {
          let res;
          if (id) {
             // Update
             res = await auth.fetchProtected(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, text })
             });
          } else {
             // Create
             res = await auth.fetchProtected(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ date, text })
             });
          }
          
          if (res.ok) {
            closeModal(); // Close modal
            loadMemories();
          } else {
            alert('Lỗi lưu kỷ niệm!');
          }
        } catch (e) {
          console.error(e);
          alert('Lỗi kết nối!');
        }
      }

      const modal = document.getElementById("memoryModal");
      const title = document.getElementById("modal-title");
      const saveBtn = document.getElementById("save-btn");

      function openCreateModal() {
        document.getElementById("memory-id").value = "";
        document.getElementById("date").value = new Date().toISOString().split('T')[0];
        document.getElementById("text").value = "";
        
        title.innerText = "Thêm kỷ niệm mới";
        saveBtn.innerText = "Lưu lại nhé 💖";
        
        modal.classList.remove("hidden");
        // Focus text?
      }

      function closeModal() {
        modal.classList.add("hidden");
      }

      function editMemory(id, date, text) {
        document.getElementById("memory-id").value = id;
        document.getElementById("date").value = date;
        document.getElementById("text").value = text;
        
        title.innerText = "Chỉnh sửa kỷ niệm ✏️";
        saveBtn.innerText = "Cập nhật";
        
        modal.classList.remove("hidden");
      }
      
      // Update syncSort to just loadMemories? Or remove it if not used. 
      // User might still change sort.
      function syncSort(value) {
        loadMemories();
      }

      async function loadMemories() {
        const list = document.getElementById("list");
        list.innerHTML = "";
        const sortType = document.getElementById("sortOrder").value || 'newest_date';

        try {
          const res = await auth.fetchProtected(API_URL);
          let memories = await res.json();

          // Sorting Logic
          if (sortType === 'newest_date') {
            memories.sort((a, b) => new Date(b.date) - new Date(a.date));
          } else if (sortType === 'oldest_date') {
            memories.sort((a, b) => new Date(a.date) - new Date(b.date));
          } else if (sortType === 'recently_added') {
            // Already sorted by server (createdAt desc due to unshift), aka "Just Added"
            // If server implementation changes, we might want to rely on createdAt if available
             memories.sort((a, b) => b.createdAt - a.createdAt);
          }

          memories.forEach((m, i) => {
            const div = document.createElement("div");
            div.className = "glass p-6 memory hover:scale-[1.02] transition";
            div.style.animationDelay = `${i * 0.1}s`;

            div.innerHTML = `
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm bg-pink-100 text-pink-600 px-3 py-1 rounded-full">
                  ${m.date}
                </span>
                <div class="flex gap-2">
                    <button onclick="editMemory('${m.id}', '${m.date}', \`${m.text.replace(/`/g, '\\`')}\`)" class="text-blue-400 hover:text-blue-600 text-sm">✎ Sửa</button>
                    <button onclick="deleteMemory('${m.id}')" class="text-red-400 hover:text-red-600 text-sm">🗑 Xóa</button>
                </div>
              </div>
              <p class="text-gray-700 leading-relaxed whitespace-pre-line">
                “${m.text}”
              </p>
            `;

            list.appendChild(div);
          });
        } catch (e) {
          console.error(e);
          list.innerHTML = '<p class="text-center text-red-500">Không thể tải kỷ niệm...</p>';
        }
      }

      function editMemory(id, date, text) {
        document.getElementById("memory-id").value = id;
        document.getElementById("date").value = date;
        document.getElementById("text").value = text;
        
        const saveBtn = document.getElementById("save-btn");
        saveBtn.innerText = "Cập nhật ✏️";
        saveBtn.classList.remove("btn-pulse"); // Stop pulsing when editing
        
        document.getElementById("cancel-btn").classList.remove("hidden");
        
        // Scroll to form on mobile
        if(window.innerWidth < 768) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      async function deleteMemory(id) {
        if(!confirm('Bạn có chắc muốn xóa không?')) return;
        try {
            await auth.fetchProtected(`${API_URL}/${id}`, { method: 'DELETE' });
            loadMemories();
        } catch (e) {
            console.error(e);
            alert('Lỗi xóa kỷ niệm!');
        }
      }

      loadMemories();
    </script>
    <script src="js/music.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", initMusic);
    </script>

    <script src="js/main.js"></script>

  </body>
</html>
