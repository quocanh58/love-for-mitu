<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Kỷ niệm của tụi mình</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      .glass {
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
        border-radius: 28px;
        box-shadow: 0 25px 60px rgba(236, 72, 153, 0.25);
      }

      .memory {
        animation: fadeUp 0.6s ease forwards;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(236, 72, 153, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(236, 72, 153, 0);
        }
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-pink-200 via-pink-100 to-rose-200 px-4 py-12"
  >
    <!-- BACK -->
    <a
      href="index.html"
      class="fixed top-4 left-4 z-50 bg-pink-500 text-white px-4 py-2 rounded-full shadow-lg hover:scale-105 transition"
    >
      ← Home
    </a>

    <div class="max-w-3xl mx-auto space-y-10">
      <!-- INPUT -->
      <div class="glass p-8 space-y-6">
        <h1 class="text-4xl font-bold text-pink-600 text-center">
          📖 Kỷ niệm của tụi mình
        </h1>

        <p class="text-center text-gray-600">
          Mỗi ngày bên nhau là một điều đáng nhớ 💞
        </p>

        <div class="space-y-4">
          <div>
            <label class="block text-pink-600 font-medium mb-1">
              📅 Ngày
            </label>
            <input
              id="date"
              type="date"
              class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 outline-none"
            />
          </div>

          <div>
            <label class="block text-pink-600 font-medium mb-1">
              💭 Kỷ niệm
            </label>
            <textarea
              id="text"
              rows="4"
              placeholder="Hôm nay tụi mình đã cười với nhau vì..."
              class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-pink-400 outline-none"
            ></textarea>
          </div>
        </div>

        <button
          onclick="saveMemory()"
          class="w-full bg-pink-500 hover:bg-pink-600 text-white py-4 rounded-xl font-semibold text-lg transition btn-pulse"
        >
          Lưu lại khoảnh khắc 💖
        </button>
      </div>

      <!-- LIST -->
      <div id="list" class="space-y-6"></div>
    </div>

    <script>
      function saveMemory() {
        const date = document.getElementById("date").value;
        const text = document.getElementById("text").value;

        if (!date || !text) return;

        const memories = JSON.parse(localStorage.getItem("memories") || "[]");

        memories.unshift({
          date,
          text,
          createdAt: Date.now(),
        });

        localStorage.setItem("memories", JSON.stringify(memories));

        document.getElementById("text").value = "";
        loadMemories();
      }

      function loadMemories() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        const memories = JSON.parse(localStorage.getItem("memories") || "[]");

        memories.forEach((m, i) => {
          const div = document.createElement("div");
          div.className = "glass p-6 memory hover:scale-[1.02] transition";

          div.style.animationDelay = `${i * 0.1}s`;

          div.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <span class="text-sm bg-pink-100 text-pink-600 px-3 py-1 rounded-full">
                ${m.date}
              </span>
              <span class="text-pink-400">💗</span>
            </div>
            <p class="text-gray-700 leading-relaxed whitespace-pre-line">
              “${m.text}”
            </p>
          `;

          list.appendChild(div);
        });
      }

      loadMemories();
    </script>
    <script src="js/music.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", initMusic);
    </script>

    <script src="js/main.js"></script>
  </body>
</html>
